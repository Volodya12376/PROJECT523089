
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Події</title>
</head>
<body>
    <h1>Події групи</h1>
    <a href="{% url 'event_create' %}">Додати подію</a>

    <a href="{% url 'event_calendar' %}">Календар</a>

    {% for event in events %}
        <div>
            <h2>
                <a href="{% url 'event_detail' event.pk %}">
                    {{ event.title }}
                </a>
            </h2>
            <p>{{ event.description }}</p>
            {{ event.starts_at|date:"d.m.Y H:i" }}
        </div>
    {% empty %}
        <p>Подій нема.</p>
    {% endfor %}
</body>
</html>
